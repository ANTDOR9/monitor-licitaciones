name: Actualizar historico SEACE (semanal)

# extract.py descarga el OCDS historico completo (.jsonl.gz, 100MB+ por
# año) -- pesado y lento, por eso corre solo 1 vez por semana, no a diario.

on:
  schedule:
    - cron: "0 11 * * 1"   # lunes 11:00 UTC = 06:00 hora Peru
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Historico SEACE/OECE
        run: python src/extract.py

      - name: Commit y push si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/licitaciones.db
          git diff --cached --quiet && echo "Sin cambios en la base." || git commit -m "actualizacion automatica de historico (semanal)"
          git push
